name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Imported 3D models are stored in R2. R2 has to be switched on once in the Cloudflare
      # dashboard (R2 → Get started); until then the worker is deployed without the bucket
      # binding and imported models stay in the browser they were imported in.
      - name: Create the R2 bucket for imported models (no-op when it exists)
        id: r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          out=$(npx wrangler r2 bucket create snapline-models 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ $status -eq 0 ] || echo "$out" | grep -q "already exists"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=R2 is not enabled::Deploying without model storage. Enable R2 in the Cloudflare dashboard (R2 → Get started) and re-run this workflow to let signed-in users sync imported models across devices."
          fi

      - name: Drop the R2 binding (R2 is not enabled on this account)
        if: steps.r2.outputs.enabled != 'true'
        run: node scripts/without-r2.mjs

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply snapline --remote

      - name: Deploy worker, assets and secrets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.deployment-url }}"
          if [ -z "$url" ]; then echo "no deployment url reported"; exit 0; fi
          # a brand-new workers.dev route can take a minute to propagate: retry before failing
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url/api/me" || echo 000)
            echo "attempt $attempt: GET $url/api/me -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::$url/api/me did not answer 200 within 2 minutes"
          exit 1
